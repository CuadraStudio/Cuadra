  <text x="450" y="1010" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#f2f4f7">Inés Arroyo</text>
  <text x="450" y="1054" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#f2f4f7" opacity="0.8">ABOGADA</text>
