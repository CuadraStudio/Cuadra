      <stop offset="0" stop-color="#16304a"/>
      <stop offset="1" stop-color="#0f2236"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.45">
      <stop offset="0" stop-color="#f2f4f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2f4f7" stop-opacity="0"/>
