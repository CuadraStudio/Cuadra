<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Escritorio de trabajo">
  <rect width="800" height="800" fill="#f2f4f7"/>

  <rect x="90" y="520" width="620" height="32" rx="16" fill="#16304a"/>
  <rect x="150" y="552" width="36" height="120" rx="10" fill="#8a6a3b"/>
  <rect x="614" y="552" width="36" height="120" rx="10" fill="#8a6a3b"/>

  <!-- lámpara -->
  <path d="M360 520 L360 420 L470 380" stroke="#16304a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M470 352 L560 388 L540 428 L452 396 Z" fill="#8a6a3b"/>
  <rect x="470" y="330" width="90" height="24" rx="12" fill="#16304a"/>

  <!-- expediente abierto -->
  <g transform="translate(180 300) rotate(4 140 100)">
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#ffffff"/>
    <rect x="280" y="10" width="40" height="170" rx="6" fill="#0f2236"/>
    <g stroke="#16304a" stroke-width="8" opacity="0.2">
      <line x1="30" y1="46" x2="240" y2="46"/>
      <line x1="30" y1="82" x2="240" y2="82"/>
      <line x1="30" y1="118" x2="200" y2="118"/>
    </g>
  </g>

  <!-- taza -->
  <rect x="600" y="452" width="70" height="60" rx="12" fill="#16304a"/>
  <path d="M670 470 q22 2 22 22 q0 20 -22 22" stroke="#16304a" stroke-width="10" fill="none"/>
  <rect x="610" y="462" width="50" height="8" rx="4" fill="#8a6a3b"/>

  <text x="90" y="730" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#16304a" opacity="0.7">Escritorio de trabajo</text>
</svg>