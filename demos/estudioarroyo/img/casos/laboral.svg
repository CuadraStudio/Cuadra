  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>

  <!-- escritorio -->
  <rect x="90" y="610" width="720" height="34" rx="17" fill="#16304a"/>
  <rect x="150" y="644" width="40" height="120" rx="10" fill="#8a6a3b"/>
  <rect x="710" y="644" width="40" height="120" rx="10" fill="#8a6a3b"/>

