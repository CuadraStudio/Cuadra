<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Pensión alimenticia: una familia y una moneda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16304a"/>
      <stop offset="1" stop-color="#0f2236"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.7" cy="0.28" r="0.42">
      <stop offset="0" stop-color="#f2f4f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f2f4f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#halo)"/>

  <!-- familia -->
  <g stroke="#f2f4f7" stroke-width="8" stroke-linecap="round">
    <line x1="230" y1="430" x2="340" y2="430"/>
    <path d="M170 300 Q170 258 195 252 Q210 250 215 264 Q218 274 207 282 Q190 296 195 318 L195 432" fill="none"/>
    <path d="M245 320 Q240 270 260 262 Q280 256 286 272 Q292 288 278 298 Q264 306 272 432" fill="none"/>
    <circle cx="300" cy="212" r="34" fill="none" stroke-width="7"/>
    <line x1="346" y1="252" x2="470" y2="430"/>
  </g>

  <!-- moneda -->
  <circle cx="830" cy="300" r="110" fill="#8a6a3b"/>
  <circle cx="830" cy="300" r="88" fill="none" stroke="#f2f4f7" stroke-width="6" opacity="0.6"/>
  <text x="830" y="324" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#f2f4f7">$</text>

  <rect x="150" y="500" width="180" height="7" rx="3.5" fill="#8a6a3b"/>
  <text x="150" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f2f4f7" opacity="0.85">Pensión alimenticia</text>
</svg>