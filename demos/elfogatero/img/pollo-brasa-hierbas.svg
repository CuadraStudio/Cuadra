<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Pollo a la brasa con hierbas">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Cuerpo del pollo -->
  <ellipse cx="100" cy="88" rx="28" ry="18" fill="#D4762C" opacity=".4" stroke="#F5EDE0" stroke-width="3.5"/>
  <!-- Pechuga -->
  <path d="M80 82 q20 -10 40 0 q-8 14 -20 14 q-12 0 -20 -14z" fill="#D4762C" opacity=".5"/>
  <!-- Patas hacia arriba -->
  <line x1="86" y1="70" x2="82" y2="56" stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="114" y1="70" x2="118" y2="56" stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M82 56 l-5 4 l-1 -6 z" fill="#F5EDE0"/>
  <path d="M118 56 l5 4 l1 -6 z" fill="#F5EDE0"/>
  <!-- Marcas de brasa -->
  <path d="M86 86 q6 4 12 0 M104 86 q6 4 12 0" stroke="#E8923E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Hierbas -->
  <path d="M94 92 q4 -8 10 -6" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M92 96 q-6 -4 -8 -10" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110 93 q4 6 10 4" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M62 100 q0 -14 10 -14 q10 -2 8 8 q-2 10 -10 9 q-8 -1 -8 -3z" fill="#F5EDE0" opacity=".6"/>
  <circle cx="130" cy="98" r="6" fill="#D4762C" opacity=".45"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>