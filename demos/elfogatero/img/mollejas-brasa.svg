<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Mollejas a la brasa">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Trozos irregulares de molleja -->
  <path d="M78 72 q-4 -12 8 -14 q12 -2 12 10 q0 10 -10 10 q-10 0 -10 -6z" fill="#D4762C" opacity=".35" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M104 76 q4 -10 14 -8 q8 2 6 10 q-2 8 -10 8 q-8 0 -10 -10z" fill="#D4762C" opacity=".3" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M86 88 q6 -8 16 -4 q6 3 2 9 q-8 8 -16 0z" fill="#F5EDE0" opacity=".9"/>
  <!-- Limón cortado -->
  <path d="M118 96 a10 10 0 0 1 20 0 z" fill="#D4762C" opacity=".4"/>
  <path d="M128 96 l-4 4 l-2 -5" stroke="#F5EDE0" stroke-width="2" stroke-linecap="round"/>
  <path d="M128 96 l3 -3" stroke="#F5EDE0" stroke-width="2" stroke-linecap="round"/>
  <!-- Perejil -->
  <path d="M96 60 q5 -8 11 -6 q0 7 -6 8 q-4 1 -5 -2z" fill="#F5EDE0"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>