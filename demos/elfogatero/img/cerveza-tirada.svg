  <path d="M84 40 h24" stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cerveza -->
  <path d="M86 50 q8 4 18 0 v38 h-18 z" fill="#D4762C" opacity=".45"/>
  <!-- Espuma -->
  <path d="M86 48 q4 -8 10 -4 q4 -6 8 0 q6 -4 8 4 z" fill="#F5EDE0" opacity=".9"/>
  <circle cx="121" cy="44" r="2" fill="#F5EDE0" opacity=".7"/>
  <circle cx="125" cy="52" r="2" fill="#F5EDE0" opacity=".6"/>
  <path d="M120 62 q8 0 12 6 q-8 6 -12 -6z" fill="#F5EDE0" opacity=".75"/>
  <path d="M122 78 q8 0 10 5 q-8 4 -10 -5z" fill="#F5EDE0" opacity=".6"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>