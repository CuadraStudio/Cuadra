<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Entraña El Fogatero">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Filete largo de entraña -->
  <path d="M62 86 Q78 60 102 66 Q126 60 138 82 Q140 92 130 94 Q108 100 84 96 Q64 94 62 86z" fill="#D4762C" opacity=".35" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Marcas de parrilla -->
  <line x1="76" y1="76" x2="82" y2="70" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="74" x2="102" y2="68" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="114" y1="74" x2="120" y2="68" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Papas a la crema -->
  <circle cx="76" cy="102" r="8" fill="none" stroke="#F5EDE0" stroke-width="3"/>
  <circle cx="94" cy="106" r="8" fill="none" stroke="#D4762C" stroke-width="3"/>
  <circle cx="112" cy="102" r="8" fill="none" stroke="#F5EDE0" stroke-width="3"/>
  <path d="M120 106 q6 4 4 10 q-8 2 -10 -4 z" fill="#D4762C" opacity=".5"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>