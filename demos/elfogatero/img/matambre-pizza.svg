<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Matambre a la pizza">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Base de matambre -->
  <path d="M66 90 Q64 70 82 68 Q102 64 124 68 Q140 70 136 90 Q132 104 112 104 Q80 106 66 90z" fill="#D4762C" opacity=".4" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Tomate derretido -->
  <ellipse cx="100" cy="82" rx="28" ry="12" fill="#D4762C" opacity=".55"/>
  <!-- Mozzarella -->
  <path d="M82 78 q18 -8 36 -2 q-14 8 -26 10 q-12 2 -10 -8z" fill="#F5EDE0" opacity=".9"/>
  <ellipse cx="108" cy="84" rx="10" ry="5" fill="#F5EDE0" opacity=".8"/>
  <!-- Orégano -->
  <g fill="#F5EDE0">
    <circle cx="88" cy="86" r="1.8"/>
    <circle cx="98" cy="90" r="1.8"/>
    <circle cx="110" cy="88" r="1.8"/>
    <circle cx="118" cy="82" r="1.8"/>
    <circle cx="94" cy="80" r="1.8"/>
  </g>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>