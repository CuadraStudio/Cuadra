  <!-- Brasas -->
  <circle cx="150" cy="190" r="10" fill="#D4762C" opacity=".5"/>
  <circle cx="172" cy="196" r="8" fill="#D4762C" opacity=".55"/>
  <circle cx="210" cy="192" r="11" fill="#D4762C" opacity=".45"/>
  <circle cx="242" cy="198" r="9" fill="#D4762C" opacity=".6"/>
  <circle cx="268" cy="188" r="7" fill="#D4762C" opacity=".5"/>
