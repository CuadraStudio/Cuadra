<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Ensalada rusa de la casa">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Bowl -->
  <path d="M72 86 h56 q0 22 -28 22 q-28 0 -28 -22z" fill="#D4762C" opacity=".25" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M72 74 h56" stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cubos de papa y vegetales -->
  <rect x="80" y="66" width="9" height="9" rx="2" fill="#D4762C" opacity=".5"/>
  <rect x="94" y="60" width="9" height="9" rx="2" fill="#F5EDE0" opacity=".85"/>
  <rect x="108" y="66" width="9" height="9" rx="2" fill="#D4762C" opacity=".4"/>
  <rect x="87" y="78" width="9" height="9" rx="2" fill="#F5EDE0" opacity=".7"/>
  <circle cx="120" cy="80" r="4" fill="#D4762C" opacity=".6"/>
  <circle cx="82" cy="82" r="3.5" fill="#F5EDE0" opacity=".5"/>
  <!-- Cucharada -->
  <line x1="126" y1="58" x2="138" y2="42" stroke="#F5EDE0" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="140" cy="38" rx="7" ry="5" transform="rotate(40 140 38)" fill="none" stroke="#F5EDE0" stroke-width="3"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
