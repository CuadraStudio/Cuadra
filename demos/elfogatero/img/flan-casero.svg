<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Flan casero">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Flan moldado -->
  <path d="M78 96 h44 l-8 -26 h-28 z" fill="#D4762C" opacity=".4" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Caramelo -->
  <path d="M80 84 q20 -4 40 0" stroke="#E8923E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M84 78 q16 -3 32 0" stroke="#E8923E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M84 94 q16 -2 32 -1" stroke="#E8923E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Crema batida -->
  <path d="M86 72 q14 -10 28 -2 q-16 8 -28 2z" fill="#F5EDE0" opacity=".9"/>
  <circle cx="96" cy="70" r="4" fill="#F5EDE0" opacity=".8"/>
  <circle cx="106" cy="68" r="3" fill="#F5EDE0" opacity=".8"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>