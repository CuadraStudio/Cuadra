<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Bife de chorizo">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Corte grueso de bife -->
  <path d="M76 86 Q78 62 102 62 Q126 62 126 84 Q126 98 104 98 Q80 98 76 86z" fill="#D4762C" opacity=".35" stroke="#F5EDE0" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Círculo de tuétano -->
  <circle cx="86" cy="80" r="8" fill="none" stroke="#E8923E" stroke-width="3"/>
  <circle cx="86" cy="80" r="3.5" fill="#E8923E"/>
  <!-- Marcas de parrilla -->
  <line x1="98" y1="74" x2="104" y2="66" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="74" x2="118" y2="66" stroke="#F5EDE0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Guarnición -->
  <path d="M132 92 q10 -2 12 6 q-10 6 -12 -6z" fill="#F5EDE0" opacity=".85"/>
  <path d="M134 98 q8 0 10 5 q-8 6 -10 -5z" fill="#D4762C" opacity=".5"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>