<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Vino de la casa en copa">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Copa de vino -->
  <path d="M84 44 a16 16 0 0 0 32 0 z" fill="#D4762C" opacity=".2" stroke="#F5EDE0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100 60 v22" stroke="#F5EDE0" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 82 h16" stroke="#F5EDE0" stroke-width="3" stroke-linecap="round"/>
  <!-- Vino -->
  <path d="M86 52 q14 8 28 0 v-4 q-14 6 -28 0 z" fill="#D4762C" opacity=".55"/>
  <!-- Gotas y brillo -->
  <path d="M90 58 q-6 0 -8 6 q2 6 8 4" fill="none" stroke="#D4762C" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M120 70 q8 2 8 10 q-8 4 -12 -2 z" fill="#F5EDE0" opacity=".5"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>