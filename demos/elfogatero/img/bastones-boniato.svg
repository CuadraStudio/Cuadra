<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Bastones de boniato">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Bastones apilados en cruz -->
  <g stroke-linecap="round">
    <line x1="88" y1="52" x2="88" y2="96" stroke="#D4762C" stroke-width="7"/>
    <line x1="100" y1="48" x2="100" y2="100" stroke="#F5EDE0" stroke-width="7"/>
    <line x1="112" y1="52" x2="112" y2="96" stroke="#D4762C" stroke-width="7"/>
    <line x1="76" y1="70" x2="124" y2="70" stroke="#F5EDE0" stroke-width="7"/>
    <line x1="74" y1="82" x2="122" y2="82" stroke="#D4762C" stroke-width="7"/>
    <line x1="94" y1="58" x2="94" y2="92" stroke="#F5EDE0" stroke-width="5"/>
    <line x1="106" y1="56" x2="106" y2="90" stroke="#F5EDE0" stroke-width="5"/>
  </g>
  <!-- Provenzal -->
  <g fill="#F5EDE0" opacity=".9">
    <circle cx="80" cy="62" r="1.6"/>
    <circle cx="120" cy="60" r="1.6"/>
    <circle cx="88" cy="74" r="1.6"/>
    <circle cx="112" cy="76" r="1.6"/>
    <circle cx="98" cy="66" r="1.6"/>
    <circle cx="96" cy="84" r="1.6"/>
    <circle cx="110" cy="86" r="1.6"/>
  </g>
  <!-- Limón -->
  <path d="M126 96 a9 9 0 0 1 18 0 z" fill="#D4762C" opacity=".35"/>
  <path d="M135 96 l-3 4 l-1 -4" stroke="#F5EDE0" stroke-width="1.8" stroke-linecap="round"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>