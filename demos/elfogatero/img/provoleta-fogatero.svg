  <circle cx="92" cy="66" r="4" fill="none" stroke="#F5EDE0" stroke-width="2.5"/>
  <circle cx="108" cy="82" r="3" fill="none" stroke="#F5EDE0" stroke-width="2.5"/>
  <circle cx="104" cy="62" r="2.5" fill="none" stroke="#F5EDE0" stroke-width="2"/>
  <circle cx="90" cy="84" r="2.5" fill="none" stroke="#F5EDE0" stroke-width="2"/>
