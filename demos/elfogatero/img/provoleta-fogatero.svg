  <!-- Provoleta derretida -->
  <circle cx="100" cy="75" r="28" fill="#D4762C" opacity=".35"/>
  <circle cx="100" cy="75" r="26" fill="none" stroke="#F5EDE0" stroke-width="4" stroke-linecap="round"/>
