<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ilustración de Rabas con limón y aioli">
  <rect width="200" height="150" fill="#2A2018" rx="8"/>
  <circle cx="100" cy="75" r="60" fill="#1A1410" stroke="#3a3028" stroke-width="1"/>
  <circle cx="100" cy="75" r="58" fill="url(#puntos)" opacity=".08"/>
  <!-- Anillos de calamar apilados -->
  <ellipse cx="100" cy="66" rx="26" ry="9" fill="none" stroke="#F5EDE0" stroke-width="4"/>
  <ellipse cx="98" cy="58" rx="22" ry="8" fill="none" stroke="#F5EDE0" stroke-width="4"/>
  <ellipse cx="102" cy="50" rx="17" ry="7" fill="none" stroke="#F5EDE0" stroke-width="4"/>
  <ellipse cx="100" cy="74" rx="24" ry="8" fill="none" stroke="#D4762C" stroke-width="3.5"/>
  <!-- Rodajas de limón -->
  <circle cx="128" cy="92" r="11" fill="none" stroke="#F5EDE0" stroke-width="3"/>
  <path d="M128 83 v18 M119 92 h18 M122 85 l12 14 M134 85 l-12 14" stroke="#F5EDE0" stroke-width="1.5"/>
  <circle cx="128" cy="92" r="5" fill="none" stroke="#D4762C" stroke-width="2"/>
  <circle cx="74" cy="92" r="10" fill="none" stroke="#F5EDE0" stroke-width="3"/>
  <path d="M74 84 v16 M66 92 h16" stroke="#F5EDE0" stroke-width="1.5"/>
  <!-- Aioli -->
  <circle cx="96" cy="94" r="9" fill="#D4762C" opacity=".4"/>
  <defs>
    <pattern id="puntos" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#F5EDE0"/>
    </pattern>
  </defs>
</svg>