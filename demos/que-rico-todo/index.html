<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Que Rico Todo! — Demo de tienda</title>

<style>
:root{--w:#7a0a18;--w2:#5a0711;--y:#f4b81c;--c:#fbf0dc;--k:#1c110c;--g:#6b5a4c;--l:#e6d5b8;--ok:#1f7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--c);color:var(--k);font:400 16px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3,.d{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.btn{background:var(--y);color:#1c110c;font-weight:800;padding:14px 20px;border-radius:10px;min-height:48px}.btn.w{background:var(--w);color:#fff}.btn.o{background:none;border:2px solid currentColor}.btn.s{padding:8px 12px;min-height:36px;font-size:14px}.btn.r{background:#b3261e;color:#fff}
header{position:sticky;top:0;z-index:20;background:var(--w);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px}
header img{width:44px;height:44px;border-radius:50%;background:#fff}header nav{display:flex;gap:4px;margin-left:auto}
header nav button{background:none;color:#fff;padding:10px;border-radius:8px;font-weight:600;font-size:14px}header nav button.on{background:var(--w2)}
.cartb{background:var(--y)!important;color:#1c110c!important;font-weight:800!important}
.demo{background:var(--y);color:#1c110c;font-size:13px;padding:6px 14px;font-weight:600}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;color:#fff;background:#1c110c center/cover}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#1c110cf2 8%,#1c110c33 70%)}
.hero div{position:relative;padding:24px 18px 34px;max-width:760px}.hero h1{font-size:clamp(46px,11vw,112px);line-height:.95;text-transform:uppercase}.hero p{font-size:18px;max-width:34ch}
.st{display:inline-block;padding:5px 12px;border-radius:99px;font-weight:800;font-size:14px;background:#fff;color:#1c110c;margin-bottom:12px}.st i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--ok)}.st.c i{background:#b3261e}
section{padding:30px 16px;max-width:1100px;margin:auto}h2{font-size:34px;margin-bottom:14px;text-transform:uppercase}
.feat{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.fc{flex:0 0 min(78vw,320px);scroll-snap-align:start;position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:var(--w) center/cover;color:#fff;text-align:left}
.fc:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c,transparent 60%)}.fc b{position:absolute;left:14px;bottom:12px;right:14px;font:400 26px/1.05 Anton,Impact}.fc span{display:block;font:600 15px Figtree}
.bar{position:sticky;top:60px;z-index:10;background:var(--c);padding:8px 0;border-bottom:2px solid var(--l)}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;background:none;border:2px solid var(--l);padding:8px 14px;border-radius:99px;font-weight:600}.chip.on{background:var(--w);border-color:var(--w);color:#fff}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:2px solid var(--l);background:#fff;color:#1c110c}
.row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:14px 0;border-bottom:1px dashed var(--l);align-items:start}
.th{width:96px;height:96px;border-radius:12px;background:var(--w) center/cover;display:grid;place-items:center;color:var(--y);font:400 34px Anton}
.row h3{font-size:22px}.row p{margin:2px 0 8px;color:var(--g);font-size:14px}.pr{font-weight:800;font-size:18px}.row.out{opacity:.55}
.tag{font-size:12px;font-weight:800;background:var(--y);color:#1c110c;border-radius:6px;padding:2px 7px;margin-left:6px}
@media(min-width:800px){#list{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}.row{grid-template-columns:120px 1fr}.th{width:120px;height:120px}}
.zones{background:var(--w);color:#fff;border-radius:16px;padding:22px;display:grid;gap:18px}@media(min-width:800px){.zones{grid-template-columns:repeat(3,1fr)}}.zones h3{color:var(--y);font-size:24px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;justify-content:flex-end;align-items:flex-end}.ov.cn{align-items:center;justify-content:center}
.pn{background:var(--c);width:100%;max-width:480px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;animation:up .2s}.ov.cn .pn{border-radius:18px}.ov:not(.cn) .pn{height:94vh;border-radius:18px 0 0 18px;max-width:440px}
@keyframes up{from{transform:translateY(24px);opacity:0}}@media(prefers-reduced-motion:reduce){.pn{animation:none}html{scroll-behavior:auto}}
.opt{display:flex;justify-content:space-between;gap:10px;padding:12px;border:2px solid var(--l);border-radius:10px;margin:6px 0;cursor:pointer;font-weight:600}.opt:has(input:checked){border-color:var(--w);background:#7a0a181a}.opt input{width:auto;accent-color:var(--w)}
.qty{display:inline-flex;align-items:center;gap:8px}.qty button{width:40px;height:40px;border-radius:50%;background:var(--l);font-size:20px;font-weight:800}
.ln{display:flex;justify-content:space-between;padding:4px 0}.tot{font:400 28px Anton;border-top:2px solid var(--k);margin-top:8px;padding-top:8px}
label.f{display:block;font-weight:600;margin:12px 0 4px}.err{color:#b3261e;font-size:14px;font-weight:600}
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:space-between;background:var(--w);color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;box-shadow:0 4px 18px #0006;width:calc(100% - 24px)}
@media(min-width:800px){.dock{display:none}}
.adm{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}.tabs button{padding:10px 16px;border-radius:10px;background:var(--l);font-weight:800;white-space:nowrap}.tabs .on{background:var(--k);color:var(--c)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:800px){.kp{grid-template-columns:repeat(4,1fr)}}.kp div{background:var(--w);color:#fff;border-radius:14px;padding:16px}.kp b{font:400 48px Anton;display:block;color:var(--y)}
.tr{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}.tr .th{width:52px;height:52px;font-size:20px;border-radius:8px}.tr .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gr{border:2px dashed var(--l);border-radius:12px;padding:10px;margin:8px 0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--c);padding:10px 18px;border-radius:99px;font-weight:800;z-index:99}
footer{padding:24px 16px 110px;text-align:center;color:var(--g);font-size:13px}

const menuScroll=()=>document.getElementById('menu').scrollIntoView();
function lst(){const q=S.q.toLowerCase().trim(),a=D.prods.filter(p=>vis(p)&&(S.cat=='all'||p.cat==S.cat||(S.cat==='pizza'&&['c0','c1'].includes(p.cat)))&&(!q||(p.name+p.desc).toLowerCase().includes(q)));
return a.length?a.map(p=>`<div class="row ${p.out?'out':''}">${th(p)}<div><h3>${esc(p.name)}${p.feat?'<span class="tag">Destacado</span>':''}${p.out?'<span class="tag">Agotado</span>':''}</h3><p>${esc(p.desc)}</p><span class="pr">${p.groups.length?'Desde ':''}${$$(p.price)}</span> <button class="btn s" ${p.out?'disabled':''} onclick="prod('${p.id}')">${p.groups.length?'Elegí cómo lo querés':'Sumar al carrito'}</button></div></div>`).join(''):'<p>No encontramos nada con esa búsqueda. Probá con otra palabra o elegí una categoría.</p>'}
const list=()=>{$('#list').innerHTML=lst()};
let cur;
function prod(id){const p=D.prods.find(x=>x.id==id);if(!p||!vis(p)||p.out)return;cur={p,sel:p.groups.map((g,i)=>g.multi?[]:[0]),qty:1};pm()}
function ext(){return cur.p.groups.reduce((a,g,i)=>a+cur.sel[i].reduce((b,j)=>b+g.opts[j].x,0),0)}
function pm(){const{p}=cur;$('#ov').innerHTML=`<div class="ov cn" onclick="if(event.target==this)cl()"><div class="pn" role="dialog" aria-label="${esc(p.name)}">${th(p,'th" style="width:100%;height:170px;border-radius:12px;background-image:url('+src(p)+')')}<h2 style="margin-top:12px">${esc(p.name)}</h2><p>${esc(p.desc)}</p>${p.groups.map((g,i)=>`<b>${esc(g.n)}${g.multi?' (opcional)':''}</b>${g.opts.map((o,j)=>`<label class="opt"><span><input type="${g.multi?'checkbox':'radio'}" name="g${i}" ${cur.sel[i].includes(j)?'checked':''} onchange="pick(${i},${j},this.checked)"> ${esc(o.n)}</span><span>${o.x?'+'+$$(o.x):'Incluido'}</span></label>`).join('')}`).join('')}
<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0"><span class="qty"><button onclick="cur.qty=Math.max(1,cur.qty-1);pm()" aria-label="Menos">−</button><b>${cur.qty}</b><button onclick="cur.qty++;pm()" aria-label="Más">+</button></span><span class="d" style="font-size:28px">${$$((p.price+ext())*cur.qty)}</span></div>
<button class="btn w" style="width:100%" onclick="add()">Sumar al carrito · ${$$((p.price+ext())*cur.qty)}</button><button class="btn o" style="width:100%;margin-top:8px" onclick="cl()">Seguir comprando</button></div></div>`}
function pick(i,j,c){const g=cur.p.groups[i];cur.sel[i]=g.multi?(c?[...cur.sel[i],j]:cur.sel[i].filter(x=>x!=j)):[j];pm()}
const cl=()=>$('#ov').innerHTML='';
function add(){const{p}=cur;if(!vis(p)||p.out)return;const det=p.groups.map((g,i)=>cur.sel[i].map(j=>g.opts[j].n)).flat(),key=p.id+'|'+det.join(','),u=p.price+ext(),ex=S.cart.find(i=>i.key==key);ex?ex.qty+=cur.qty:S.cart.push({key,name:p.name,det,unit:u,qty:cur.qty});save();cl();render();toast('Sumado al carrito')}
function cart(){const c=S.cart,s=sub(),sh=c.length?D.ship:0;let b;
 if(S.step=='done')b='<h2>Revisá tu pedido</h2><p>Los precios y el envío son de ejemplo. El local confirma el pedido y el importe por WhatsApp.</p><pre class="receipt">'+esc(S.preview)+'</pre><a class="cta whatsapp" href="https://wa.me/59896377591?text='+esc(encodeURIComponent(S.preview))+'" target="_blank" rel="noopener noreferrer">Enviar pedido por WhatsApp</a><button class="btn w" onclick="S.step=&quot;cart&quot;;cart()">Volver al carrito</button>';
else if(!c.length)b=`<h2>Tu carrito</h2><p>Todavía no sumaste nada. Elegí algo de la carta y arrancamos.</p><button class="btn" onclick="cl()">Ver la carta</button>`;
else if(S.step=='cart')b=`<h2>Tu carrito</h2>${c.map((i,n)=>`<div class="ln"><div><b>${esc(i.name)}</b><br><small>${esc(i.det.join(', '))}</small><br><span class="qty"><button onclick="q(${n},-1)" aria-label="Menos">−</button>${i.qty}<button onclick="q(${n},1)" aria-label="Más">+</button></span> <button class="btn s o" onclick="S.cart.splice(${n},1);save();render();cart()">Quitar</button></div><b>${$$(i.unit*i.qty)}</b></div>`).join('')}<div class="ln"><span>Subtotal</span>${$$(s)}</div><div class="ln"><span>Envío (importe de demo)</span>${$$(sh)}</div><div class="ln tot"><span>Total</span>${$$(s+sh)}</div><button class="btn w" style="width:100%;margin-top:10px" onclick="S.step='form';cart()">Hacé tu pedido</button><button class="btn o" style="width:100%;margin-top:8px" onclick="cl()">Seguir comprando</button>`;
else b=`<h2>Tus datos</h2>${[['name','Nombre'],['tel','Teléfono'],['addr','Dirección de entrega']].map(([k,l])=>`<label class="f">${l}</label><input value="${esc(S.f[k]||'')}" oninput="S.f.${k}=this.value" ${k=='tel'?'inputmode="tel"':''}>`).join('')}<label class="f">Localidad</label><select onchange="S.f.loc=this.value"><option value="">Elegí tu localidad</option>${ZONES.map(z=>`<option ${S.f.loc==z?'selected':''}>${z}</option>`).join('')}</select><label class="f">Medio de pago</label>${PAY.map(p=>`<label class="opt"><span><input type="radio" name="pay" ${S.f.pay==p?'checked':''} onchange="S.f.pay='${p}'"> ${p}</span></label>`).join('')}<label class="f">Observaciones (opcional)</label><textarea rows="2" oninput="S.f.obs=this.value">${esc(S.f.obs||'')}</textarea><div class="ln"><span>Subtotal</span>${$$(s)}</div><div class="ln"><span>Envío (demo)</span>${$$(sh)}</div><div class="ln tot"><span>Total</span>${$$(s+sh)}</div><div class="err" id="er"></div><button class="btn w" style="width:100%;margin-top:10px" onclick="send()">Previsualizar pedido</button><button class="btn o" style="width:100%;margin-top:8px" onclick="S.step='cart';cart()">Volver al carrito</button>`;
$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)cl()"><div class="pn" role="dialog" aria-label="Carrito">${b}</div></div>`}
function q(n,d){S.cart[n].qty+=d;if(S.cart[n].qty<1)S.cart.splice(n,1);save();render();cart()}
function send(){const f=S.f;if(!f.name?.trim()||!f.tel?.trim()||!f.addr?.trim()||!f.loc){$('#er').textContent='Completá nombre, teléfono, dirección y localidad para seguir.';return}
const s=sub(),t=['*Consulta de pedido — Que Rico Todo!*','Precios y envío de la demo, sujetos a confirmación.','','Nombre: '+f.name,'Teléfono: '+f.tel,'Dirección: '+f.addr,'Localidad: '+f.loc,'','*Productos*',...S.cart.map(i=>`• ${i.qty} x ${i.name}${i.det.length?' ('+i.det.join(', ')+')':''} — ${$$(i.unit*i.qty)}`),'','Subtotal: '+$$(s),'Envío: '+$$(D.ship),'*Total: '+$$(s+D.ship)+'*','Medio de pago: '+f.pay,'Observaciones: '+(f.obs||'—')].join('\n');
 S.preview=t;S.step='done';cart()}
/* ADMIN */
function admin(){const T=[['dash','Resumen'],['prods','Productos'],['cats','Categorías'],['cfg','Envío y datos']];return`<div class="adm"><div class="tabs">${T.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}<button onclick="go('shop')">Ver tienda →</button></div>`+({dash:()=>{const a=D.prods.filter(p=>p.on).length;return`<div class="kp"><div><b>${D.prods.length}</b>Productos</div><div><b>${D.cats.length}</b>Categorías</div><div><b>${a}</b>Activos</div><div><b>${D.prods.length-a}</b>Pausados</div></div><p>Accesos rápidos:</p><button class="btn" onclick="pf()">Crear producto</button> <button class="btn o" onclick="S.tab='cats';render()">Ordenar categorías</button> <button class="btn o" onclick="if(confirm('Se borran tus cambios y vuelve el catálogo de ejemplo.')){D=seed();save();render();toast('Demo restablecida')}">Restablecer demo</button><p style="color:var(--g)">Todo lo que cambies acá se ve al instante en la tienda y queda guardado en este navegador.</p>`},prods:()=>`<button class="btn" onclick="pf()">Crear producto</button>`+D.prods.map(p=>`<div class="tr">${th(p)}<div><b>${esc(p.name)}</b>${p.feat?'<span class="tag">Destacado</span>':''}${p.out?'<span class="tag">Agotado</span>':''}<br><small>${esc(cat(p.cat)?.n||'Sin categoría')} · ${$$(p.price)} · ${p.on?'Activo':'Pausado'}</small></div><div class="acts"><button class="btn s o" onclick="tg('${p.id}','on')">${p.on?'Pausar':'Activar'}</button><button class="btn s o" onclick="tg('${p.id}','out')">${p.out?'Hay stock':'Agotado'}</button><button class="btn s" onclick="pf('${p.id}')">Editar</button><button class="btn s r" onclick="if(confirm('¿Eliminar ${esc(p.name).replace(/'/g,'')}?')){D.prods=D.prods.filter(x=>x.id!='${p.id}');save();render()}">Eliminar</button></div></div>`).join(''),
cats:()=>`<div style="display:flex;gap:8px"><input id="nc" placeholder="Nombre de la categoría nueva"><button class="btn" onclick="ac()">Crear</button></div>`+D.cats.map((c,i)=>`<div class="tr" style="grid-template-columns:1fr auto"><input value="${esc(c.n)}" onchange="D.cats[${i}].n=this.value;save();toast('Nombre guardado')"><div class="acts"><button class="btn s o" onclick="mv(${i},-1)" aria-label="Subir">↑</button><button class="btn s o" onclick="mv(${i},1)" aria-label="Bajar">↓</button><button class="btn s o" onclick="D.cats[${i}].on=!D.cats[${i}].on;save();render()">${c.on?'Desactivar':'Activar'}</button><button class="btn s r" onclick="dc(${i})">Eliminar</button></div></div>`).join(''),
cfg:()=>`<label class="f">Costo de envío (importe de demo, en pesos)</label><input type="number" min="0" value="${D.ship}" onchange="D.ship=+this.value||0;save();toast('Envío guardado')"><p style="color:var(--g)">Localidades, horarios y medios de pago se muestran en la tienda pero todavía no se editan desde acá: llegarían en una próxima versión.</p>`}[S.tab])()+'</div>'}
const tg=(id,k)=>{const p=D.prods.find(x=>x.id==id);p[k]=!p[k];save();render()};
const mv=(i,d)=>{const j=i+d;if(j<0||j>=D.cats.length)return;[D.cats[i],D.cats[j]]=[D.cats[j],D.cats[i]];save();render()};
const ac=()=>{const v=$('#nc').value.trim();if(!v)return toast('Escribí un nombre');D.cats.push({id:'c'+Date.now(),n:v,on:true});save();render()};
const dc=i=>{const c=D.cats[i];if(D.prods.some(p=>p.cat==c.id))return toast('Mové o eliminá sus productos primero');D.cats.splice(i,1);save();render()};
let ed;
function pf(id){ed=id?JSON.parse(JSON.stringify(D.prods.find(p=>p.id==id))):{id:'p'+Date.now(),cat:D.cats[0]?.id,name:'',desc:'',price:0,img:'',feat:false,on:true,out:false,groups:[]};
const gt=ed.groups.map(g=>`${g.n}${g.multi?' [opcional]':''}\n`+g.opts.map(o=>`  ${o.n} | ${o.x}`).join('\n')).join('\n\n');
$('#ov').innerHTML=`<div class="ov cn" onclick="if(event.target==this)cl()"><div class="pn"><h2>${id?'Editar':'Nuevo'} producto</h2><label class="f">Foto</label><div id="pv">${th(ed)}</div><input type="file" accept="image/*" onchange="up(this)"><label class="f">Nombre</label><input id="fn" value="${esc(ed.name)}"><label class="f">Descripción</label><textarea id="fd" rows="2">${esc(ed.desc)}</textarea><label class="f">Precio base</label><input id="fp" type="number" min="0" value="${ed.price}"><label class="f">Categoría</label><select id="fc">${D.cats.map(c=>`<option value="${c.id}" ${c.id==ed.cat?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
<label class="opt"><span>Destacado en portada</span><input type="checkbox" id="ff" ${ed.feat?'checked':''}></label><label class="opt"><span>Activo (se muestra en la tienda)</span><input type="checkbox" id="fo" ${ed.on?'checked':''}></label><label class="opt"><span>Agotado</span><input type="checkbox" id="fa" ${ed.out?'checked':''}></label>
<label class="f">Opciones y adicionales</label><small>Un grupo por bloque: título en la primera línea (sumá [opcional] si se puede elegir más de una) y una opción por línea con "nombre | costo extra". Dejá una línea vacía entre grupos.</small><textarea id="fg" rows="7">${esc(gt)}</textarea><div class="err" id="fe"></div><button class="btn w" style="width:100%;margin-top:10px" onclick="sp(${!!id})">Guardar producto</button><button class="btn o" style="width:100%;margin-top:8px" onclick="cl()">Cancelar</button></div></div>`}
function up(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ed.img=c.toDataURL('image/jpeg',.75);$('#pv').innerHTML=th(ed)};i.src=r.result};r.readAsDataURL(f)}
function sp(isEdit){const n=$('#fn').value.trim();if(!n){$('#fe').textContent='Ponele un nombre al producto.';return}
ed.groups=$('#fg').value.split(/\n\s*\n/).map(b=>b.split('\n').filter(l=>l.trim())).filter(b=>b.length>1).map(b=>({n:b[0].replace(/\s*\[opcional\]/i,'').trim(),multi:/\[opcional\]/i.test(b[0]),opts:b.slice(1).map(l=>{const[a,x]=l.split('|');return{n:a.trim(),x:+x||0}})}));
Object.assign(ed,{name:n,desc:$('#fd').value,price:+$('#fp').value||0,cat:$('#fc').value,feat:$('#ff').checked,on:$('#fo').checked,out:$('#fa').checked});
isEdit?D.prods=D.prods.map(p=>p.id==ed.id?ed:p):D.prods.push(ed);save();cl();render();toast('Producto guardado')}
addEventListener('hashchange',()=>{const r=location.hash=='#admin'?'admin':'shop';if(r!=S.route){S.route=r;render()}});render();
</script></body></html>
